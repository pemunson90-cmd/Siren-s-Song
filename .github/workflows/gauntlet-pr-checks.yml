name: Gauntlet PR checks

on:
  pull_request:
    branches: ['main', 'gauntlet/production']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gauntlet-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guidance:
    name: guidance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test guidance detector
        run: python3 scripts/toolchain/test-check-gauntlet-guidance.py
      - name: Audit current branch's governing instructions
        run: python3 scripts/toolchain/check-gauntlet-guidance.py --root .

  game-smoke:
    name: game-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TOOLCHAIN_CACHE: ${{ github.workspace }}/../sirens-song-toolchain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Determine whether gameplay or tooling changed
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f game/project.godot ]]; then
            echo 'game=false' >> "$GITHUB_OUTPUT"
          elif [[ -z "$BASE_SHA" ]]; then
            echo 'game=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" HEAD -- game scripts/toolchain .github/workflows; then
            echo 'game=false' >> "$GITHUB_OUTPUT"
          else
            echo 'game=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Restore verified Godot download cache
        id: godot-cache
        if: steps.changes.outputs.game == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TOOLCHAIN_CACHE }}/downloads
          key: godot-4.6.3-official-sha512-v1
      - name: Install pinned Godot toolchain
        if: steps.changes.outputs.game == 'true'
        run: |
          scripts/toolchain/install-godot.sh
          echo "$TOOLCHAIN_CACHE/bin" >> "$GITHUB_PATH"
      - name: Cache verified official download
        if: steps.changes.outputs.game == 'true' && steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TOOLCHAIN_CACHE }}/downloads
          key: godot-4.6.3-official-sha512-v1
      - name: Validate import and deterministic core game
        if: steps.changes.outputs.game == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          scripts/toolchain/headless.sh --editor --import --quit 2>&1 | tee artifacts/pr-import.log
          if grep -nE 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' artifacts/pr-import.log; then exit 1; fi
          scripts/toolchain/headless.sh --script res://tests/run_tests.gd 2>&1 | tee artifacts/pr-core.log
          if grep -nE 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' artifacts/pr-core.log; then exit 1; fi
          grep -Eq '^CHECKS [1-9][0-9]* FAILURES 0$' artifacts/pr-core.log
      - name: Validate navigation, recovery and touch runtime regressions
        if: steps.changes.outputs.game == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r scenario summary; do
            log="artifacts/pr-$scenario.log"
            scripts/toolchain/headless.sh --script "res://tests/$scenario.gd" 2>&1 | tee "$log"
            if grep -nE 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' "$log"; then exit 1; fi
            grep -Eq "^$summary CHECKS [1-9][0-9]* FAILURES 0$" "$log"
          done <<'UI_SCENARIOS'
          runtime_tests|RUNTIME
          fleet_instruments_ui_tests|FLEET INSTRUMENTS UI
          fleet_ring_ui_tests|FLEET RING UI
          campaign_instruments_ui_tests|CAMPAIGN INSTRUMENT UI
          route_telemetry_touch_tests|ROUTE TELEMETRY TOUCH
          recovery_route_ui_tests|RECOVERY ROUTE UI
          shelf_habitat_tests|SHELF HABITAT
          shelf_habitat_journey_tests|SHELF HABITAT JOURNEY
          shelf_habitat_ui_tests|SHELF HABITAT UI
          wake_crossing_tests|WAKE CROSSING
          wake_crossing_journey_tests|WAKE CROSSING JOURNEY
          wake_crossing_ui_tests|WAKE CROSSING UI
          onward_mission_tests|ONWARD MISSIONS
          cadence_correlator_tests|CADENCE CORRELATOR
          contact_reports_tests|CONTACT REPORT
          contact_reports_ui_tests|CONTACT REPORT UI
          campaign_consequence_tests|CAMPAIGN CONSEQUENCES
          campaign_equipment_save_tests|CAMPAIGN EQUIPMENT SAVE
          witness_evacuation_tests|WITNESS EVACUATION
          witness_evacuation_journey_tests|WITNESS EVACUATION JOURNEY
          witness_evacuation_ui_tests|WITNESS EVACUATION UI
          warning_recipient_tests|WARNING RECIPIENT
          warning_recipient_journey_tests|WARNING RECIPIENT JOURNEY
          warning_recipient_ui_tests|WARNING RECIPIENT UI
          blackwater_delivery_ui_tests|BLACKWATER DELIVERY UI
          blackwater_delivery_runtime_ui_tests|BLACKWATER DELIVERY RUNTIME UI
          blackwater_delivery_tests|BLACKWATER DELIVERY
          earned_course_continuity_tests|EARNED COURSE CONTINUITY
          current_motion_tests|CURRENT MOTION
          module_recovery_tests|MODULE RECOVERY
          module_recovery_ui_tests|MODULE RECOVERY UI
          module_recovery_runtime_ui_tests|MODULE RECOVERY RUNTIME UI
          module_inventory_main_tests|MODULE INVENTORY MAIN
          rendezvous_transport_tests|RENDEZVOUS TRANSPORT
          rendezvous_ui_tests|RENDEZVOUS UI
          briefing_scroll_fitting_ui_tests|BRIEFING SCROLL FITTING UI
          warning_chain_tests|WARNING CHAIN
          warning_chain_journey_tests|WARNING CHAIN JOURNEY
          warning_chain_ui_tests|WARNING CHAIN UI
          warning_chain_audio_tests|WARNING CHAIN AUDIO
          warning_chain_world_ui_tests|WARNING CHAIN WORLD UI
          UI_SCENARIOS
      - name: Docs-only change; no Godot run
        if: steps.changes.outputs.game == 'false'
        run: echo 'No active Godot game or gameplay change. Guidance is checked separately.'
