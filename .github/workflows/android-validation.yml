name: Android validation

on:
  workflow_dispatch:
  push:
    branches: ['gauntlet/production']
    paths: ['.github/native-milestone.txt']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-smoke:
    if: ${{ github.ref == 'refs/heads/gauntlet/production' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      VERIFY_SIREN_ROLES: '1'
      VERIFY_BLACKWATER: '1'
      VERIFY_TOUCH_TARGETS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve external toolchain cache path
        run: echo "TOOLCHAIN_CACHE=$(realpath -m "$GITHUB_WORKSPACE/../sirens-song-toolchain")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK explicitly
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools build-tools;36.0.0 emulator'
          log-accepted-android-sdk-licenses: false
      - name: Restore official Godot downloads
        id: godot-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TOOLCHAIN_CACHE }}/downloads
          key: godot-4.6.3-official-sha512-v1
      - name: Install pinned native toolchain
        run: |
          scripts/toolchain/install-godot.sh
          echo "$TOOLCHAIN_CACHE/bin" >> "$GITHUB_PATH"
      - name: Cache verified Godot downloads before runtime tests
        if: ${{ success() && steps.godot-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TOOLCHAIN_CACHE }}/downloads
          key: godot-4.6.3-official-sha512-v1
      - name: Prepare development signing identity
        run: scripts/toolchain/configure.sh
      - name: Record actual emulator capabilities
        run: |
          mkdir -p "$ARTIFACT_DIR"
          if test -f "$ANDROID_HOME/emulator/source.properties"; then
            cat "$ANDROID_HOME/emulator/source.properties" | tee "$ARTIFACT_DIR/emulator-package.txt"
          fi
          probe() {
            local name="$1" status=0
            shift
            timeout 30 "$@" > "$ARTIFACT_DIR/$name.txt" 2>&1 || status=$?
            cat "$ARTIFACT_DIR/$name.txt"
            echo "Probe exit status: $status" | tee -a "$ARTIFACT_DIR/$name.txt"
          }
          probe emulator-version "$ANDROID_HOME/emulator/emulator" -no-window -noaudio -version
          probe emulator-gpu-help "$ANDROID_HOME/emulator/emulator" -no-window -noaudio -help-gpu
          probe emulator-shared-libraries ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64-headless"
      - name: Headless import and simulation tests
        run: |
          mkdir -p "$ARTIFACT_DIR"
          scripts/toolchain/headless.sh 2>&1 | tee "$ARTIFACT_DIR/import.log"
          if grep -E 'SCRIPT ERROR:|ERROR:' "$ARTIFACT_DIR/import.log"; then exit 1; fi
          scripts/toolchain/test.sh
      - name: Build signed debug APK
        run: scripts/toolchain/build.sh android 2>&1 | tee "$ARTIFACT_DIR/build.log"
      - name: Enable hosted-runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          acceleration_status=0
          timeout 30 "$ANDROID_HOME/emulator/emulator" -no-window -noaudio -accel-check > "$ARTIFACT_DIR/emulator-acceleration.txt" 2>&1 || acceleration_status=$?
          cat "$ARTIFACT_DIR/emulator-acceleration.txt"
          echo "Acceleration probe exit status: $acceleration_status" | tee -a "$ARTIFACT_DIR/emulator-acceleration.txt"
      - name: Upload emulator capabilities before boot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-capabilities
          path: artifacts/emulator-*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Native Android install and lifecycle smoke
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: scripts/toolchain/android-smoke.sh
      - name: Upload build and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-native-evidence
          path: |
            artifacts/*.log
            artifacts/*.txt
            artifacts/*.sha256
            artifacts/android-smoke/logcat.txt
            artifacts/android-smoke/godot-events.txt
            artifacts/android-smoke/progress.txt
            artifacts/android-smoke/runtime-errors.txt
            artifacts/android-smoke/install.txt
            artifacts/android-smoke/launcher-component.txt
            artifacts/android-smoke/fingerprint.txt
            artifacts/android-smoke/launch-*.txt
            artifacts/android-smoke/pid-*.txt
            artifacts/android-smoke/rotation-*.txt
            artifacts/android-smoke/view-check-*.txt
            artifacts/android-smoke/density-*.txt
            artifacts/android-smoke/ui-metrics-*.txt
            artifacts/android-smoke/ui-metrics-*.json
            artifacts/android-smoke/role-*.txt
            artifacts/android-smoke/role-*.json
            artifacts/android-smoke/role-fixture.save
            artifacts/android-smoke/blackwater/*.txt
            artifacts/android-smoke/blackwater/*.json
            artifacts/android-smoke/blackwater/*.save
            artifacts/android-smoke/checkpoint-*.txt
            artifacts/android-smoke/runtime-state-*.txt
            artifacts/android-smoke/app-exit-info.txt
            artifacts/android-smoke/app-memory-*.txt
            artifacts/android-smoke/system-server-*.txt
            artifacts/android-smoke/system-dialog-*.txt
            artifacts/android-smoke/system-dialog-*.xml
            artifacts/android-smoke/*.stderr.txt
            artifacts/android-smoke/final-display.png
            artifacts/android-smoke/failed-target.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload cover viewport screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-cover-screenshots
          path: |
            artifacts/android-smoke/cover*.png
            artifacts/android-smoke/blackwater/cover*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload inner viewport screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-inner-screenshots
          path: |
            artifacts/android-smoke/inner*.png
            artifacts/android-smoke/blackwater/inner*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload installable APK separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sirens-song-debug-apk
          path: |
            artifacts/*.apk
            artifacts/*.apk.sha256
            artifacts/apk-signature.txt
          if-no-files-found: warn
          retention-days: 14
