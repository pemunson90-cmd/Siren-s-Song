name: Android validation

on:
  workflow_dispatch:
  push:
    branches: ['gauntlet/**']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TOOLCHAIN_CACHE: ${{ github.workspace }}/.toolchain-cache
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK explicitly
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Cache official Godot downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .toolchain-cache/downloads
          key: godot-4.6.3-official-sha512-v1
      - name: Preserve development APK signing identity
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .toolchain-cache/debug.keystore
          key: sirens-song-development-signing-v1
      - name: Install pinned native toolchain
        run: |
          scripts/toolchain/install-godot.sh
          echo "$TOOLCHAIN_CACHE/bin" >> "$GITHUB_PATH"
      - name: Headless import and simulation tests
        run: |
          mkdir -p "$ARTIFACT_DIR"
          scripts/toolchain/headless.sh 2>&1 | tee "$ARTIFACT_DIR/import.log"
          if grep -E 'SCRIPT ERROR:|ERROR:' "$ARTIFACT_DIR/import.log"; then exit 1; fi
          scripts/toolchain/test.sh
      - name: Build signed debug APK
        run: scripts/toolchain/build.sh android 2>&1 | tee "$ARTIFACT_DIR/build.log"
      - name: Enable hosted-runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Native Android install and lifecycle smoke
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: scripts/toolchain/android-smoke.sh
      - name: Upload build and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-native-evidence
          path: |
            artifacts/
            !artifacts/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Upload installable APK separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sirens-song-debug-apk
          path: artifacts/*.apk
          if-no-files-found: warn
          retention-days: 14
