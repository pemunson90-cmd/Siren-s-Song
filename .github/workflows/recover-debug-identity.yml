name: Recover established debug signing identity

# One-off recovery only. Root removes this workflow after Git persistence.
on:
  push:
    branches: ['gauntlet/production']
    paths: ['.github/workflows/recover-debug-identity.yml']

permissions:
  contents: read

jobs:
  recover-debug-identity:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/gauntlet/production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve external toolchain cache path
        run: echo "TOOLCHAIN_CACHE=$(realpath -m "$GITHUB_WORKSPACE/../sirens-song-toolchain")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore established production signing identity
        id: signing-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TOOLCHAIN_CACHE }}/debug.keystore
          key: sirens-song-development-signing-v1
          fail-on-cache-miss: true
      - name: Verify established certificate
        env:
          CACHE_HIT: ${{ steps.signing-cache.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" != 'true' ]]; then
            echo 'Exact production signing-cache hit required; no key will be generated.' >&2
            exit 1
          fi
          if [[ ! -f "$TOOLCHAIN_CACHE/debug.keystore" ]]; then
            echo 'Restored debug keystore is missing; recovery stopped.' >&2
            exit 1
          fi
          certificate_sha256=$("$JAVA_HOME/bin/keytool" -exportcert -keystore "$TOOLCHAIN_CACHE/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | awk '{print $1}')
          echo "Recovered public certificate SHA256: $certificate_sha256"
          if [[ "$certificate_sha256" != '32bcb2287acd01c1f58c26997c7639f3072c74c6b03ab2a24656dc7cd1c7dc3c' ]]; then
            echo 'Certificate does not match the established installed-build identity; recovery stopped.' >&2
            exit 1
          fi
      - name: Export verified non-production debug key for authorized Git persistence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: established-debug-signing-identity
          path: ${{ env.TOOLCHAIN_CACHE }}/debug.keystore
          if-no-files-found: error
          retention-days: 1
